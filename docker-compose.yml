services:
  # PostgreSQL 数据库 (带 pgvector 向量扩展)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-research_assistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research_user} -d ${POSTGRES_DB:-research_assistant}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research_network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: research_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research_network

  # FastAPI 后端
  backend:
    image: research-assistant-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: research_backend
    # Default enable GPU for local NVIDIA environments; CI disables via .github/docker-compose.ci.yml.
    gpus: ${DOCKER_BACKEND_GPUS:-all}
    environment:
      - APP_ENV=${APP_ENV:-development}
      # UTF-8 runtime guard: keep logs / Chinese text stable across host shells.
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - PYTHONUTF8=${CONTAINER_PYTHONUTF8:-1}
      - PYTHONIOENCODING=${CONTAINER_PYTHONIOENCODING:-UTF-8}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - SQLALCHEMY_ECHO=${SQLALCHEMY_ECHO:-false}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ALIYUN_API_KEY=${ALIYUN_API_KEY}
      - ALIYUN_BASE_URL=${ALIYUN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - ALIYUN_MODEL=${ALIYUN_MODEL:-qwen-plus}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - ALIYUN_EMBEDDING_API_KEY=${ALIYUN_EMBEDDING_API_KEY}
      - ALIYUN_EMBEDDING_MODEL=${ALIYUN_EMBEDDING_MODEL:-text-embedding-v2}
      # 本地嵌入模型配置
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      - LOCAL_EMBEDDING_DEVICE=${LOCAL_EMBEDDING_DEVICE:-auto}
      - LOCAL_EMBEDDING_BATCH_SIZE=${LOCAL_EMBEDDING_BATCH_SIZE:-32}
      - LOCAL_EMBEDDING_MAX_LENGTH=${LOCAL_EMBEDDING_MAX_LENGTH:-8192}
      - LOCAL_EMBEDDING_CACHE_DIR=/app/model_cache
      - HF_HOME=/app/model_cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/model_cache/huggingface/hub
      - TRANSFORMERS_CACHE=/app/model_cache/huggingface/transformers
      - XDG_CACHE_HOME=/app/model_cache/xdg-cache
      - HOST_HUGGINGFACE_CACHE_MOUNT=/app/host_model_cache/huggingface
      - MODEL_CACHE_PREWARM_REPOS=${MODEL_CACHE_PREWARM_REPOS:-BAAI/bge-m3,Alibaba-NLP/gte-reranker-modernbert-base}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - LOCAL_EMBEDDING_NORMALIZE=${LOCAL_EMBEDDING_NORMALIZE:-true}
      - LOCAL_EMBEDDING_DIMENSION=${LOCAL_EMBEDDING_DIMENSION:-0}
      - KB_ONLINE_MM_INGEST_ENABLED=${KB_ONLINE_MM_INGEST_ENABLED:-true}
      - ENABLE_RERANKER=${ENABLE_RERANKER:-true}
      - RERANKER_MODEL=${RERANKER_MODEL:-Alibaba-NLP/gte-reranker-modernbert-base}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-auto}
      - RERANKER_TOP_K=${RERANKER_TOP_K:-8}
      - ENABLE_HYBRID_RETRIEVAL=${ENABLE_HYBRID_RETRIEVAL:-true}
      - HYBRID_VECTOR_TOP_K=${HYBRID_VECTOR_TOP_K:-20}
      - HYBRID_TEXT_TOP_K=${HYBRID_TEXT_TOP_K:-20}
      - HYBRID_RRF_K=${HYBRID_RRF_K:-60}
      - PGVECTOR_HNSW_EF_SEARCH=${PGVECTOR_HNSW_EF_SEARCH:-40}
      - AGENT_KNOWLEDGE_SCORE_THRESHOLD=${AGENT_KNOWLEDGE_SCORE_THRESHOLD:-0.5}
      - ENABLE_QUERY_REWRITE=${ENABLE_QUERY_REWRITE:-true}
      - QUERY_REWRITE_STRATEGIES=${QUERY_REWRITE_STRATEGIES:-synonym,hyde,decompose}
      - QUERY_REWRITE_MAX_SYNONYMS=${QUERY_REWRITE_MAX_SYNONYMS:-3}
      - QUERY_REWRITE_MAX_SUBQUERIES=${QUERY_REWRITE_MAX_SUBQUERIES:-3}
      - QUERY_REWRITE_MAX_VARIANTS=${QUERY_REWRITE_MAX_VARIANTS:-8}
      - QUERY_REWRITE_HYDE_MAX_CHARS=${QUERY_REWRITE_HYDE_MAX_CHARS:-240}
      - QUERY_REWRITE_TIMEOUT_SECONDS=${QUERY_REWRITE_TIMEOUT_SECONDS:-12}
      - QUERY_REWRITE_TEMPERATURE=${QUERY_REWRITE_TEMPERATURE:-0.2}
      - ENABLE_CONTEXTUAL_COMPRESSION=${ENABLE_CONTEXTUAL_COMPRESSION:-true}
      - CONTEXTUAL_COMPRESSION_TIMEOUT_SECONDS=${CONTEXTUAL_COMPRESSION_TIMEOUT_SECONDS:-12}
      - CONTEXTUAL_COMPRESSION_TEMPERATURE=${CONTEXTUAL_COMPRESSION_TEMPERATURE:-0.0}
      - CONTEXTUAL_COMPRESSION_MIN_RELEVANCE=${CONTEXTUAL_COMPRESSION_MIN_RELEVANCE:-4.0}
      - CONTEXTUAL_COMPRESSION_MAX_CHARS_PER_CHUNK=${CONTEXTUAL_COMPRESSION_MAX_CHARS_PER_CHUNK:-2200}
      - CONTEXTUAL_COMPRESSION_MAX_OUTPUT_TOKENS=${CONTEXTUAL_COMPRESSION_MAX_OUTPUT_TOKENS:-400}
      - CONTEXTUAL_COMPRESSION_MAX_CONCURRENCY=${CONTEXTUAL_COMPRESSION_MAX_CONCURRENCY:-3}
      - DOCUMENT_PROCESSING_STALE_TIMEOUT_SECONDS=${DOCUMENT_PROCESSING_STALE_TIMEOUT_SECONDS:-7200}
      - CHUNK_QUALITY_GATE_ENABLED=${CHUNK_QUALITY_GATE_ENABLED:-false}
      - CHUNK_QUALITY_GATE_MODEL=${CHUNK_QUALITY_GATE_MODEL:-qwen3.5:0.8b-stable}
      - DOCLING_URL=${DOCLING_URL:-http://research_pdf_hybrid_backend:5002}
      - CHUNK_QUALITY_GATE_TIMEOUT_SECONDS=${CHUNK_QUALITY_GATE_TIMEOUT_SECONDS:-40}
      - CHUNK_QUALITY_GATE_BAD_THRESHOLD=${CHUNK_QUALITY_GATE_BAD_THRESHOLD:-0.50}
      - CHUNK_QUALITY_GATE_SUSPECT_THRESHOLD=${CHUNK_QUALITY_GATE_SUSPECT_THRESHOLD:-0.65}
      - CHUNK_QUALITY_GATE_NEIGHBOR_WINDOW=${CHUNK_QUALITY_GATE_NEIGHBOR_WINDOW:-1}
      - CHUNK_QUALITY_GATE_MAX_CHUNKS=${CHUNK_QUALITY_GATE_MAX_CHUNKS:-300}
      - CHUNK_QUALITY_GATE_DOC_FAIL_RATIO=${CHUNK_QUALITY_GATE_DOC_FAIL_RATIO:-0.55}
      - CHUNK_QUALITY_GATE_FAIL_OPEN=${CHUNK_QUALITY_GATE_FAIL_OPEN:-true}
      - CHUNK_QUALITY_GATE_FAIL_ON_UNREPAIRED_BAD=${CHUNK_QUALITY_GATE_FAIL_ON_UNREPAIRED_BAD:-false}
      - CHUNK_REPAIR_ENABLED=${CHUNK_REPAIR_ENABLED:-true}
      - CHUNK_REPAIR_MAX_ROUNDS=${CHUNK_REPAIR_MAX_ROUNDS:-1}
      - CHUNK_REPAIR_MAX_FRAGMENTS=${CHUNK_REPAIR_MAX_FRAGMENTS:-120}
      - CHUNK_REPAIR_MAX_CHARS_PER_CHUNK=${CHUNK_REPAIR_MAX_CHARS_PER_CHUNK:-1800}
      - PDF_RAG_LINE_PIPELINE_ENABLED=${PDF_RAG_LINE_PIPELINE_ENABLED:-true}
      - PDF_RAG_STRUCTURED_MODE=${PDF_RAG_STRUCTURED_MODE:-fast}
      - PDF_RAG_FAIL_OPEN=${PDF_RAG_FAIL_OPEN:-true}
      - PDF_RAG_QWEN_DEVICE=${PDF_RAG_QWEN_DEVICE:-auto}
      - PDF_RAG_ACTION_MODEL_DIR=${PDF_RAG_ACTION_MODEL_DIR:-models/runtime/qwen_action_lora_merged_v2_manual}
      - PDF_RAG_CLEAN_MODEL_DIR=${PDF_RAG_CLEAN_MODEL_DIR:-models/runtime/qwen_clean_lora_merged_v1}
      - PDF_RAG_CHUNK_MODEL_DIR=${PDF_RAG_CHUNK_MODEL_DIR:-models/runtime/qwen_chunk_lora_merged_v1}
      - PDF_RAG_OCR_ENABLED=${PDF_RAG_OCR_ENABLED:-true}
      - PDF_RAG_OCR_MODEL=${PDF_RAG_OCR_MODEL:-qwen3.5:0.8b-stable}
      - PDF_RAG_OCR_TIMEOUT_SECONDS=${PDF_RAG_OCR_TIMEOUT_SECONDS:-30}
      - PDF_RAG_OCR_DPI=${PDF_RAG_OCR_DPI:-180}
      - PDF_RAG_OCR_PADDING=${PDF_RAG_OCR_PADDING:-4.0}
      - PDF_LAYOUT_PARSER=${PDF_LAYOUT_PARSER:-document_mind}
      - READER_DOCUMENT_MIND_ENABLED=${READER_DOCUMENT_MIND_ENABLED:-true}
      - READER_DOCUMENT_MIND_ALLOWLIST=${READER_DOCUMENT_MIND_ALLOWLIST:-}
      - DOCUMENT_MIND_ACCESS_KEY_ID=${DOCUMENT_MIND_ACCESS_KEY_ID}
      - DOCUMENT_MIND_ACCESS_KEY_SECRET=${DOCUMENT_MIND_ACCESS_KEY_SECRET}
      - DOCUMENT_MIND_REGION_ID=${DOCUMENT_MIND_REGION_ID:-cn-hangzhou}
      - DOCUMENT_MIND_ENDPOINT=${DOCUMENT_MIND_ENDPOINT:-docmind-api.aliyuncs.com}
      - DOCUMENT_MIND_OPTION=${DOCUMENT_MIND_OPTION:-docStructure}
      - DOCUMENT_MIND_POLL_INTERVAL_SECONDS=${DOCUMENT_MIND_POLL_INTERVAL_SECONDS:-1.5}
      - DOCUMENT_MIND_TIMEOUT_SECONDS=${DOCUMENT_MIND_TIMEOUT_SECONDS:-90}
      - READER_MM_ASSIST_ENABLED=${READER_MM_ASSIST_ENABLED:-true}
      - READER_MM_PARSER_MODEL=${READER_MM_PARSER_MODEL:-qwen3-vl-flash}
      - READER_MM_PARSER_FALLBACK_MODEL=${READER_MM_PARSER_FALLBACK_MODEL:-qwen-vl-ocr-latest}
      - READER_MM_LAYOUT_MODEL=${READER_MM_LAYOUT_MODEL:-qwen3.5-plus}
      - READER_MM_PRIMARY_MODEL=${READER_MM_PRIMARY_MODEL:-qwen3-vl-flash}
      - READER_MM_FALLBACK_MODEL=${READER_MM_FALLBACK_MODEL:-qwen3-vl-plus}
      - READER_MM_TIMEOUT_MS=${READER_MM_TIMEOUT_MS:-180000}
      - READER_MM_PARSER_TIMEOUT_MS=${READER_MM_PARSER_TIMEOUT_MS:-240000}
      - READER_MM_MAX_TOKENS=${READER_MM_MAX_TOKENS:-12000}
      - READER_MM_PARSER_MAX_TOKENS=${READER_MM_PARSER_MAX_TOKENS:-12000}
      - READER_SIMPLIFIED_PIPELINE_ENABLED=${READER_SIMPLIFIED_PIPELINE_ENABLED:-false}
      - READER_SIMPLIFIED_ALLOWLIST_PAPERS=${READER_SIMPLIFIED_ALLOWLIST_PAPERS:-}
      - READER_SIMPLIFIED_ALLOWLIST_PAGES=${READER_SIMPLIFIED_ALLOWLIST_PAGES:-}
      - READER_PIPELINE_MODE=${READER_PIPELINE_MODE:-single_agent_v2}
      - READER_PIPELINE_ALLOWLIST_PAPERS=${READER_PIPELINE_ALLOWLIST_PAPERS:-}
      - READER_PIPELINE_ALLOWLIST_PAGES=${READER_PIPELINE_ALLOWLIST_PAGES:-}
      - READER_PIPELINE_VERSION=${READER_PIPELINE_VERSION:-layout_uid_v1}
      - READER_AGENT_MODEL=${READER_AGENT_MODEL:-qwen3.5-plus}
      - READER_AGENT_TIMEOUT_MS=${READER_AGENT_TIMEOUT_MS:-90000}
      - READER_AGENT_MAX_TOKENS=${READER_AGENT_MAX_TOKENS:-7000}
      - READER_AGENT_MAX_STEPS=${READER_AGENT_MAX_STEPS:-12}
      - READER_AGENT_MAX_REPAIR_ROUNDS=${READER_AGENT_MAX_REPAIR_ROUNDS:-2}
      - READER_COMPOSE_LATENCY_BUDGET_MS=${READER_COMPOSE_LATENCY_BUDGET_MS:-20000}
      - READER_COMPOSE_LATENCY_BUDGET_MAX_MS=${READER_COMPOSE_LATENCY_BUDGET_MAX_MS:-25000}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - REACT_MAX_ITERATIONS=${REACT_MAX_ITERATIONS:-5}
      # Reader Compose 文本模式约束：默认不依赖多模态能力。
      - READER_MULTIMODAL_ENABLED=${READER_MULTIMODAL_ENABLED:-false}
      # Reader Compose 外网补图默认关闭，避免与文本模型能力不匹配。
      - READER_EXTERNAL_IMAGE_ENABLED=${READER_EXTERNAL_IMAGE_ENABLED:-false}
      - MCP_ENABLED=${MCP_ENABLED:-false}
      - MCP_TOOL_PREFIX=${MCP_TOOL_PREFIX:-mcp}
      - MCP_CALL_TIMEOUT_SECONDS=${MCP_CALL_TIMEOUT_SECONDS:-20}
      - MCP_CONFIG_PATH=${MCP_CONFIG_PATH:-mcp_servers.json}
      - MCP_SERVERS=${MCP_SERVERS:-[]}
      - MCP_TOOL_ROUTES=${MCP_TOOL_ROUTES:-{}}
      - MCP_BRAVE_API_KEY=${MCP_BRAVE_API_KEY}
      - MCP_TAVILY_API_KEY=${MCP_TAVILY_API_KEY}
      - MCP_EXA_API_KEY=${MCP_EXA_API_KEY}
      - MCP_FIRECRAWL_API_KEY=${MCP_FIRECRAWL_API_KEY}
      - MCP_GITHUB_TOKEN=${MCP_GITHUB_TOKEN}
      - MCP_ROUTE_TIMEOUT_SECONDS=${MCP_ROUTE_TIMEOUT_SECONDS:-15}
      - MCP_ROUTE_RETRY_ATTEMPTS=${MCP_ROUTE_RETRY_ATTEMPTS:-2}
      - MCP_ROUTE_RETRY_BACKOFF_SECONDS=${MCP_ROUTE_RETRY_BACKOFF_SECONDS:-0.5}
      - MCP_ROUTE_CIRCUIT_BREAKER_FAILURES=${MCP_ROUTE_CIRCUIT_BREAKER_FAILURES:-3}
      - MCP_ROUTE_CIRCUIT_BREAKER_OPEN_SECONDS=${MCP_ROUTE_CIRCUIT_BREAKER_OPEN_SECONDS:-120}
      - API_RATE_LIMIT_ENABLED=${API_RATE_LIMIT_ENABLED:-true}
      - API_RATE_LIMIT_STORAGE=${API_RATE_LIMIT_STORAGE:-auto}
      - API_RATE_LIMIT_REDIS_URL=${API_RATE_LIMIT_REDIS_URL:-}
      - API_RATE_LIMIT_WINDOW_SECONDS=${API_RATE_LIMIT_WINDOW_SECONDS:-60}
      - API_RATE_LIMIT_AUTH_PER_MINUTE=${API_RATE_LIMIT_AUTH_PER_MINUTE:-20}
      - API_RATE_LIMIT_CHAT_PER_MINUTE=${API_RATE_LIMIT_CHAT_PER_MINUTE:-60}
      - API_RATE_LIMIT_KNOWLEDGE_PER_MINUTE=${API_RATE_LIMIT_KNOWLEDGE_PER_MINUTE:-120}
      - API_RATE_LIMIT_CODELAB_PER_MINUTE=${API_RATE_LIMIT_CODELAB_PER_MINUTE:-30}
      - CODELAB_RUNNER_ENABLED=${CODELAB_RUNNER_ENABLED:-true}
      - CODELAB_RUNNER_URL=${CODELAB_RUNNER_URL:-http://codelab-runner:8099}
      - CODELAB_RUNNER_TOKEN=${CODELAB_RUNNER_TOKEN:?CODELAB_RUNNER_TOKEN is required}
      - CODELAB_RUNNER_TIMEOUT_SECONDS=${CODELAB_RUNNER_TIMEOUT_SECONDS:-25}
      - CODELAB_RUNNER_CONNECT_TIMEOUT_SECONDS=${CODELAB_RUNNER_CONNECT_TIMEOUT_SECONDS:-3}
      # 预热
      - RETRIEVAL_WARMUP_ON_STARTUP=${RETRIEVAL_WARMUP_ON_STARTUP:-true}
    ports:
      - "8888:8000"
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - model_cache:/app/model_cache
      - type: bind
        source: ${HOST_HUGGINGFACE_CACHE_DIR:-/mnt/c/Users/yui/.cache/huggingface}
        target: /app/host_model_cache/huggingface
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codelab-runner:
        condition: service_started
    command: >
      sh -c 'set -eu; alembic upgrade head; if [ "${BACKEND_UVICORN_RELOAD:-true}" = "true" ]; then
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-exclude "model_cache/*" --reload-exclude ".cache/*" --reload-exclude "tests/*" --reload-exclude "docs/*" --reload-exclude "e2e/*" --timeout-graceful-shutdown "${BACKEND_UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}";
      fi; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "${BACKEND_UVICORN_WORKERS:-1}" --timeout-graceful-shutdown "${BACKEND_UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN:-30}"'
    networks:
      - research_network

  pdf-hybrid-backend:
    image: research-assistant-backend:latest
    container_name: research_pdf_hybrid_backend
    gpus: ${DOCKER_BACKEND_GPUS:-all}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - PYTHONUTF8=${CONTAINER_PYTHONUTF8:-1}
      - PYTHONIOENCODING=${CONTAINER_PYTHONIOENCODING:-UTF-8}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - LOCAL_STRUCTURED_PDF_HYBRID_MODEL=${LOCAL_STRUCTURED_PDF_HYBRID_MODEL:-qwen3.5:0.8b}
      - LOCAL_STRUCTURED_PDF_HYBRID_MODEL_CHAIN=${LOCAL_STRUCTURED_PDF_HYBRID_MODEL_CHAIN:-qwen3.5:0.8b,qwen3.5:2b-q4_K_M,qwen3.5:4b-q4_K_M}
      - LOCAL_STRUCTURED_PDF_HYBRID_DISABLE_THINKING=${LOCAL_STRUCTURED_PDF_HYBRID_DISABLE_THINKING:-true}
      - LOCAL_STRUCTURED_PDF_HYBRID_ENABLE_NATIVE_FALLBACK=${LOCAL_STRUCTURED_PDF_HYBRID_ENABLE_NATIVE_FALLBACK:-false}
      - PDF_HYBRID_BACKEND_FORCE_OCR=${PDF_HYBRID_BACKEND_FORCE_OCR:-false}
      - PDF_HYBRID_BACKEND_OCR_LANG=${PDF_HYBRID_BACKEND_OCR_LANG:-}
      - PDF_HYBRID_BACKEND_ENRICH_FORMULA=${PDF_HYBRID_BACKEND_ENRICH_FORMULA:-false}
      - PDF_HYBRID_BACKEND_ENRICH_PICTURE_DESCRIPTION=${PDF_HYBRID_BACKEND_ENRICH_PICTURE_DESCRIPTION:-false}
      - PDF_HYBRID_BACKEND_PICTURE_DESCRIPTION_PROMPT=${PDF_HYBRID_BACKEND_PICTURE_DESCRIPTION_PROMPT:-}
      - HF_HOME=/app/model_cache/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/model_cache/huggingface/hub
      - TRANSFORMERS_CACHE=/app/model_cache/huggingface/transformers
      - XDG_CACHE_HOME=/app/model_cache/xdg-cache
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    ports:
      - "5002:5002"
    volumes:
      - ./backend:/app
      - model_cache:/app/model_cache
    command: >
      sh -c 'set -eu; set -- --host 0.0.0.0 --port 5002; if [ "${PDF_HYBRID_BACKEND_FORCE_OCR:-false}" = "true" ]; then
        set -- "$@" --force-ocr;
      fi; if [ -n "${PDF_HYBRID_BACKEND_OCR_LANG:-}" ]; then
        set -- "$@" --ocr-lang "${PDF_HYBRID_BACKEND_OCR_LANG}";
      fi; if [ "${PDF_HYBRID_BACKEND_ENRICH_FORMULA:-false}" = "true" ]; then
        set -- "$@" --enrich-formula;
      fi; if [ "${PDF_HYBRID_BACKEND_ENRICH_PICTURE_DESCRIPTION:-false}" = "true" ]; then
        set -- "$@" --enrich-picture-description;
      fi; if [ -n "${PDF_HYBRID_BACKEND_PICTURE_DESCRIPTION_PROMPT:-}" ]; then
        set -- "$@" --picture-description-prompt "${PDF_HYBRID_BACKEND_PICTURE_DESCRIPTION_PROMPT}";
      fi; exec python -m app.services.local_structured_pdf.opendataloader_upstream_hybrid_server "$@"'
    restart: unless-stopped
    networks:
      - research_network

  codelab-runner:
    image: research-assistant-backend:latest
    container_name: research_codelab_runner
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - PYTHONUTF8=${CONTAINER_PYTHONUTF8:-1}
      - PYTHONIOENCODING=${CONTAINER_PYTHONIOENCODING:-UTF-8}
      - CODELAB_RUNNER_TOKEN=${CODELAB_RUNNER_TOKEN:?CODELAB_RUNNER_TOKEN is required}
      - CODELAB_EXEC_TIMEOUT_HARD_SECONDS=${CODELAB_EXEC_TIMEOUT_HARD_SECONDS:-20}
      - PYTHONUNBUFFERED=1
    command: uvicorn app.sandbox_runner.main:app --host 0.0.0.0 --port 8099
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - research_network

  # React 前端
  # MCP web server (Phase 2, profile: mcp)
  mcp_web:
    image: research-assistant-backend:latest
    container_name: research_mcp_web
    environment:
      - SERPER_API_KEY=${SERPER_API_KEY}
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - PYTHONUTF8=${CONTAINER_PYTHONUTF8:-1}
      - PYTHONIOENCODING=${CONTAINER_PYTHONIOENCODING:-UTF-8}
      - MCP_WEB_HOST=${MCP_WEB_HOST:-0.0.0.0}
      - MCP_WEB_PORT=${MCP_WEB_PORT:-8091}
      - MCP_WEB_TRANSPORT=${MCP_WEB_TRANSPORT:-streamable-http}
    command: python -m app.mcp_servers.web_server
    ports:
      - "${MCP_WEB_PORT:-8091}:8091"
    profiles:
      - mcp
    networks:
      - research_network

  # MCP literature server (Phase 2, profile: mcp)
  mcp_literature:
    image: research-assistant-backend:latest
    container_name: research_mcp_literature
    environment:
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - PYTHONUTF8=${CONTAINER_PYTHONUTF8:-1}
      - PYTHONIOENCODING=${CONTAINER_PYTHONIOENCODING:-UTF-8}
      - MCP_LITERATURE_HOST=${MCP_LITERATURE_HOST:-0.0.0.0}
      - MCP_LITERATURE_PORT=${MCP_LITERATURE_PORT:-8092}
      - MCP_LITERATURE_TRANSPORT=${MCP_LITERATURE_TRANSPORT:-streamable-http}
    command: python -m app.mcp_servers.literature_server
    ports:
      - "${MCP_LITERATURE_PORT:-8092}:8092"
    profiles:
      - mcp
    networks:
      - research_network

  frontend:
    image: node:20-alpine
    container_name: research_frontend
    working_dir: /app
    environment:
      - LANG=${CONTAINER_LANG:-C.UTF-8}
      - LC_ALL=${CONTAINER_LC_ALL:-C.UTF-8}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8888}
      - VITE_WS_BASE_URL=${VITE_WS_BASE_URL:-ws://localhost:8888}
      - VITE_SHOW_RAG_METRICS=${VITE_SHOW_RAG_METRICS:-false}
      - VITE_PROXY_TARGET=${VITE_PROXY_TARGET:-http://backend:8000}
      - VITE_DEV_WATCH_POLLING=${VITE_DEV_WATCH_POLLING:-true}
      - VITE_DEV_WATCH_POLLING_INTERVAL=${VITE_DEV_WATCH_POLLING_INTERVAL:-300}
      - VITE_DISABLE_HOST_MODULE_ALIASES=${VITE_DISABLE_HOST_MODULE_ALIASES:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then
        npm install;
      fi && rm -rf node_modules/.vite && npm run dev -- --config vite.docker.config.ts --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    networks:
      - research_network

networks:
  research_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  model_cache:
    # 嵌入模型缓存 (避免重复下载)
    # 新增：前端 node_modules 命名卷

  frontend_node_modules:
