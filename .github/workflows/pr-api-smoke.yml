name: PR API Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: development
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: ci_strong_password_123
      POSTGRES_DB: research_assistant
      DATABASE_URL: postgresql://research_user:ci_strong_password_123@postgres:5432/research_assistant
      SECRET_KEY: ci_secret_key_abcdefghijklmnopqrstuvwxyz_123456
      CODELAB_RUNNER_TOKEN: ci_runner_internal_token_1234567890
      API_RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_STORAGE: memory
      API_RATE_LIMIT_AUTH_PER_MINUTE: "200"
      API_RATE_LIMIT_CHAT_PER_MINUTE: "240"
      API_RATE_LIMIT_KNOWLEDGE_PER_MINUTE: "480"
      API_RATE_LIMIT_CODELAB_PER_MINUTE: "120"
      DEEPSEEK_API_KEY: dummy
      SERPER_API_KEY: dummy
      PIP_INDEX_URL: https://pypi.org/simple
      EMBEDDING_PROVIDER: mock
      MOCK_EMBEDDING_MODEL: mock/deterministic
      MOCK_EMBEDDING_DIMENSION: "256"
      VITE_API_BASE_URL: http://localhost:8888
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml up -d --build backend frontend postgres redis codelab-runner

      - name: Wait backend ready
        run: |
          for i in {1..80}; do
            if curl -fsS http://localhost:8888/docs >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Backend not ready" >&2
          docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml logs --tail 200 backend
          exit 1

      - name: Run API smoke scripts
        shell: pwsh
        run: |
          ./acceptance_tests.ps1
          ./e2e/role_business_api_smoke_e2e.ps1
          ./e2e/remaining_modules_api_smoke_e2e.ps1

      - name: Broad exception guard
        run: python backend/checks/check_no_new_broad_excepts.py

      - name: Contract alignment guard
        run: python backend/checks/check_contract_alignment.py

      - name: Prepare artifact folders
        if: always()
        run: |
          mkdir -p output/e2e output/playwright

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-api-smoke-logs
          path: |
            output/e2e/**
            output/playwright/**

      - name: Stack logs
        if: always()
        run: |
          docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml logs --tail 120 backend
          docker compose -f docker-compose.yml -f .github/docker-compose.ci.yml logs --tail 120 frontend
