interface:
  display_name: "Paper Reproduction"
  short_description: "Project-first paper reproduction workflow"
  default_prompt: "Use $paper-reproduction for project-based paper reproduction tasks. When the user wants to do reproduction work, read and follow this skill first. Keep the flow simple: resolve the paper, resolve the project, if no project exists create it with `paper_research_prepare`, if a project exists check it with `paper_research_status`, and if prepare is not finished run `paper_research_prepare`. As soon as prepare is finished, stop trying to do the reproduction work yourself and start using `project_claude` as the worker in the current Project directory until Claude reports a result. Use `paper_search` only to find a saved paper by title, authors, keywords, or natural-language description; if `paper_id` is already known, pass it directly instead of searching for the numeric ID. Use `project_tree` only to inspect directory structure, `project_read_file` to read known files, `project_write_file` only when you want to overwrite a file with complete final contents, `paper_research_probe_repo` for remote repo reachability, `paper_research_probe_url` for lightweight checks of external links, and `paper_research_search_project_zoekt` only for targeted text search. Do not stay in an inspection loop after prepare is ready; hand the concrete reproduction task to `project_claude`. Good Zoekt queries include `file:README fastText`, `(README or docs) supervised`, `content:\"train_supervised\"`, `bucket wordNgrams dim lr epoch`, `file:classification-results.sh test`, or `file:dictionary.cc getLine`. If a Zoekt query returns 0 results, shorten it to one strong term or one concrete filename and do not use `*` as a directory listing query."

policy:
  allow_implicit_invocation: true
