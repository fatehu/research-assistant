name: paper-reproduction
description: >-
  Project-first paper reproduction skill. Use when the user wants to reproduce
  a saved paper, continue an existing paper reproduction project, or inspect a
  paper implementation repository for reproduction work.
when_to_use: >-
  Use this skill for project-based paper reproduction tasks. Resolve the paper
  and project first. If no project exists, create it through
  paper_research_prepare. If a project exists, check it with
  paper_research_status. If prepare is not finished, run
  paper_research_prepare. As soon as prepare is finished, use project_claude as
  the worker for the actual reproduction work until Claude reports a result.
session_system_prompt: |-
  Paper reproduction session contract:
  - 你是策划者和决策者，不是实施 worker。
  - 你负责论文解读、复现准备、Project/reference readiness 检查、实验策略、调优方向、风险判断，以及确定下一条给 worker 的具体指令。
  - 代码修改、命令执行、调试、训练运行和复现交付都交给 Claude Code，通过 `project_claude` 在当前 Project 内完成。
  - bash/命令类工具只用于了解情况、探测环境、检查路径和状态、收集准备信息；不能作为 Claude Code 不可用或失败后的实施 fallback。
  - 如果 Claude Code 不可用，直接报告实施被 Claude Code/runtime-worker 阻塞，并等待用户重试或修复运行时；不要自行改文件、跑训练或写执行脚本。
category: generic
family: paper-reproduction
allowed_channels:
  - chat
interface_metadata_path: agents/openai.yaml
user_invocable: true
execution_context: inline
agent: primary
effort: low
aliases: []
trigger_keywords: []
blocked_tool_names:
  - project_bash
  - project_write_file
continue_policies:
  - manual
default_continue_policy: manual
scripts:
  - path: scripts/render_stage_prompt.py
    purpose: Render the stage launch prompt with project/reference-first guidance.
stages:
  - id: planning
    title: Planning
    continue_policy: manual
    reads: []
    writes: []
  - id: execution
    title: Execution
    continue_policy: manual
    reads: []
    writes: []
  - id: tuning
    title: Tuning
    continue_policy: manual
    reads: []
    writes: []
artifacts:
  - path: reference/paper/paper_pdf2md.md
  - path: reference/paper/paper_interpretation.md
  - path: reference/paper/paper_interpretation.json
  - path: reference/repo/readme_intake.json
