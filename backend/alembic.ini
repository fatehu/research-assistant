# Alembic configuration file

[alembic]
# Migration script location
script_location = alembic

# Revision filename template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Truncate revision slug length
truncate_slug_length = 40

# Revision environment flag
revision_environment = false

# Version path separator
version_path_separator = os

# Prepend sys.path
prepend_sys_path = .

# Timezone
timezone = UTC

# SQLAlchemy URL placeholder
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
